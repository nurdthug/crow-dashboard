name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install zsh for sync-script test
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Run protocol and discovery tests
        run: npm test
      - name: Seed live backend URL from committed beacon
        run: node -e 'const fs=require("node:fs"); const beacon=require("./oracle.json"); fs.writeFileSync("/tmp/crow-oracle-public-url", beacon.backend.baseUrl + "\n");'
      - name: Check live beacon contract
        run: npm run beacon:check
